[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cirrus-s-1a"
version = "0.0.1"
description = "A tiny, hyper-optimized autoregressive search agent for NVIDIA DGX Spark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []  # the agent harness, perf model and drafter are stdlib-only

[project.optional-dependencies]
model = ["torch>=2.8"]
train = ["torch>=2.8", "flash-linear-attention>=0.3", "datasets", "tokenizers"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["cirrus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
